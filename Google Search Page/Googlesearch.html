<!DOCTYPE html>
<html>
  <head>
    <title>Google.comm</title>
    <style>
     
      .google-logo {
        object-position: center;
        margin-bottom: 5px;
        margin-top: 150px;
      }

      .google-searchbar {
        width: 700px;
        border-radius: 30px;
        border: none;
        box-shadow: 0px 1px 6px rgba(0, 0, 0, 0.1);
        padding-top: 15px;
        padding-bottom: 15px;
        padding-left: 15px;
        margin-bottom: 30px;
      }

      .google {
        text-align: center;
      }

      .google-button {
        border: none;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 16px;
        padding-right: 16px;
        margin-right: 5px;
        background-color: rgb(245, 245, 245);
        
      }

      .button {
        text-align: center;
      }

    </style>
  </head>
  <body>
    <div class="google">
      <img class="google-logo" src="thumbnails/Google_2015_logo.svg.webp">
      <br>
      <input class="google-searchbar" type="text" placeholder="Search Google or type a URL">
    </div>

    <div class="button">
      <button class="google-button">Google Search</button>
      <button class="google-button">I'm Feeling Lucky</button>
    </div>
    
  </body>
</html>
